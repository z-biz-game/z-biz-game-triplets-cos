name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 没有构建步骤：仓库里跑的就是线上跑的（纯 ESM，无打包器），所以站点是一次文件拷贝。
      # 名单是逐条对过的：index.html 与 css/game.css 现在引用的是 css/ js/ icons/（真位图图标）
      # assets/（可平铺纹理 + 三帧 sprite + og 卡）加 manifest.webmanifest 与 sw.js。
      # 少发一样就是一次 404：图标没了还能玩，manifest/sw 没了就装不上，纹理没了页面掉成纯黑。
      # 用 `path: .` 会把 server.cjs、tools/（里面躺着 tools/golden.mjs = 每张出货盘的唯一解）、
      # tests/ 和 *.md 一起传上去——tools/verify.sh 第 5 段那四条 404 断言拦的就是这个。
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          # assets/ 只上纹理与位图；assets/gen/ 是产图的 Python 源码，站点不吃它。
          cp -r assets/textures assets/img _site/assets/
          # 名单的反证：答案、门禁脚本、生成器一个都不许进来（第 5 段在线上/替身根各打一次 404）
          test ! -e _site/tools && test ! -e _site/tests && test ! -e _site/server.cjs
          test ! -e _site/assets/gen
          find _site -name '*.md' -o -name 'golden.mjs' | grep . && exit 1 || true
      # configure-pages@v5：本仓此前没有 Pages 站点，这一步会顺手建一个。
      # deploy-pages@v4 + upload-pages-artifact@v3 是配套的——早先用 deploy-pages@v3 时
      # 出现过"CI 绿、站点 404"（取不到 artifact），同组织其他仓踩过。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
